const CAT={bp:['Barra y banco','tríceps, deltoides','Escápulas juntas, pies firmes; baja la barra al pecho con control y empuja.','Rebotar, codos muy abiertos, despegar glúteos.',['pm','ii','pg']],

gs:['Mancuerna o kettlebell','core','Carga al pecho; baja con la espalda recta.','Inclinarse hacia delante.',['pr','sq']],
cf:['Máquina curl femoral','gemelos','Rodillas alineadas con el eje; flexiona y vuelve lento.','Levantar la cadera.',['ct']],
ct:['Máquina tumbada','gemelos','Cadera pegada al banco; sube controlado.','Levantar la cadera.',['cf']],

ab:['Máquina de abductores','—','Espalda apoyada; abre con control.','Impulso.',[]],

const EF=['Fácil','Adecuado','Muy exigente','Fallo muscular'];
let S,tab='i',sub='',eff=1,db=new Promise((r,j)=>{const q=indexedDB.open('ep',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const load=async()=>{const d=await db;return new Promise((r,j)=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})};
const save=async()=>{try{const d=await db,tx=d.transaction('k','readwrite');tx.onerror=tx.onabort=()=>toast('No se pudo guardar: '+((tx.error&&tx.error.message)||'error de almacenamiento'));tx.objectStore('k').put(S,'s')}catch(e){toast('No se pudo guardar: '+e.message)}};
const toast=t=>{const b=$('#bn');b.textContent=t;b.style.display='block';setTimeout(()=>b.style.display='none',4000)};
const exv=id=>({kg:X[id][2],st:X[id][3],...(S.x[id]||{})}),
lastKg=id=>{const l=S.logs.filter(l=>l.ex===id).sort((a,b)=>b.t-a.t)[0];return l?l.kg:exv(id).kg},
e1=l=>l.reps<=12?l.kg*(1+l.reps/30):null,
bd=s=>`<span class="b b${s}">${{c:'confirmado',a:'aproximado',p:'por confirmar'}[s]}</span>`;
function lv(){const t=D(),r=S.ready[t];if(!r)return null;const m=S.m[t]||S.m[D(new Date(Date.now()+864e5))];
if(r.bad)return['x','No fuerces el entrenamiento: dolor agudo, mareo, enfermedad o síntomas preocupantes. Orientativo, no es un diagnóstico.'];
if(r.sl<6||r.f>=3||r.mo>=3||m)return['a','Considera ajustes (sueño, fatiga, molestias o partido cercano). Decides tú; no cambio nada solo.'];return['g','Entrena según lo previsto.']}
function home(){const t=D(),dw=new Date().getDay(),p=S.mv[t]||PL[dw],l=lv(),w=S.w.slice().sort((a,b)=>a.d<b.d?-1:1),n=S.s.filter(s=>s.d===t);
const sc=k=>S.s.filter(s=>s.d===t&&s.k===k).length;
return`<h2>Hoy</h2>${ms()}${props().length?'<div class="k a">Hay propuestas nuevas en Progreso.</div>':''}<div class="k hero"><h3>${p?RT[p][0]:dw===5?'Viernes: complementaria (eliges al empezar)':'Sin gimnasio hoy'}</h3><div class=m>${HK[dw]||'Sin hockey'}</div>
<div class=r style="margin-top:8px">${HK[dw]?`<button class="s ${S.m[t]?'on':''}" onclick="tg('m')">Hay partido</button>`:''}${dw===4?`<button class="s ${S.prep[t]?'on':''}" onclick="tg('prep')">Prep. física hecha</button>`:''}</div></div>
<div class="k ${l?l[0]:''}"><h3>Preparación</h3>${l?`<div>${l[1]}</div>`:''}<div class=r style="margin-top:6px"><label class=m>Sueño h <input type=number step=.5 id=sl value="${(S.ready[t]||{}).sl??''}"></label>
<select id=fa><option value=1>Fatiga baja<option value=2>Fatiga media<option value=3>Fatiga alta</select><select id=mo><option value=1>Sin molestias<option value=2>Molestias leves<option value=3>Molestias fuertes</select></div>
<label class=m><input type=checkbox id=bad style="width:auto;min-height:0"> Dolor agudo, mareo o enfermedad</label><br><button onclick="rd()" style="margin-top:6px">Valorar</button></div>
${ng()}${pr()}<div class=k><h3>Suplementos hoy</h3><div class=r><button class=s onclick="sp('creatina')">Creatina (${sc('creatina')})</button><button class=s onclick="sp('proteína')">Proteína (${sc('proteína')})</button></div><div class=m>Dosis: configúrala según la etiqueta de tu producto (no la invento).</div></div>
<div class=k><h3>Peso</h3>${w.length?`<b>${w[w.length-1].kg} kg</b> <span class=m>${w[w.length-1].d}</span>`:'<div class=m>Sin mediciones. Añádela en Perfil (peso inicial conocido: 59 kg, sin registrar).</div>'}</div>`}
function rd(){S.ready[D()]={sl:parseFloat($('#sl').value),f:+$('#fa').value,mo:+$('#mo').value,bad:$('#bad').checked};if(isNaN(S.ready[D()].sl)||S.ready[D()].sl<0||S.ready[D()].sl>16)return toast('Indica horas de sueño entre 0 y 16.');save();go()}
function tg(k){const t=D();S[k][t]=!S[k][t];save();go()}
function sp(k){S.s.push({id:U(),d:D(),k,t:Date.now()});save();go()}

const ids=ids_(a),id=ids[a.i],e=X[id],ev=exv(id),dn=S.logs.filter(l=>l.sid===a.id&&l.ex===id);
return`${mt()}<h2>${RT[a.rk][0]} · ${a.i+1}/${ids.length}</h2><div class="k ex"><h3>${e[0]} ${bd(ev.st)}</h3><div class=m>Objetivo: ${cf(id).sets}×${cf(id).lo}–${cf(id).hi} · ${e[4]||''} Los pesos de máquinas distintas no son comparables.</div>
${dn.map((l,i)=>`<div>Serie ${i+1}: ${l.kg} kg × ${l.reps} · ${EF[l.rpe]} <a href=# onclick="dl('${l.id}');return false" class=m>borrar</a></div>`).join('')}
<div class=r style="margin:8px 0"><input type=number step=.5 id=kg value="${dv(id,'kg',lastKg(id)??'')}" oninput="dr('${id}','kg',this.value)" onchange="save()"> kg × <input type=number id=rp value="${dv(id,'rp',8)}" oninput="dr('${id}','rp',this.value)" onchange="save()"> reps</div>
<div class=r>${EF.map((x,i)=>`<button class="s ${i===eff?'on':''}" onclick="eff=${i};go()">${x}</button>`).join('')}</div>
